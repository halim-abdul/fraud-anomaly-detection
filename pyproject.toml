[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-anomaly-detection"
version = "0.1.0"
description = "Supervised and unsupervised fraud anomaly detection with streaming inference and explainable alerts"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
